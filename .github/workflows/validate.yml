name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install mkdocs-material
      - run: mkdocs build --strict

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Configure disposable database
        run: |
          umask 077
          {
            printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'RUNTIME_DB_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'SeedAdmin__Email=%s\n' 'admin@example.com'
            printf 'SeedAdmin__Password=%s\n' 'ChangeMe1234567!'
            printf 'SeedAdmin__FirstName=%s\n' 'Admin'
            printf 'SeedAdmin__LastName=%s\n' 'User'
            printf 'SeedDemoData__Enabled=%s\n' 'true'
            printf 'SeedDemoData__Password=%s\n' "$(openssl rand -hex 32)"
          } > .env
      - run: dotnet build backend/Locatarius.slnx --configuration Release --warnaserror
      - name: Run tests
        run: >
          dotnet test backend/Locatarius.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore
      - name: Build and smoke-test containers
        run: |
          docker compose up --build --wait --wait-timeout 120
          test "$(curl --fail --silent --show-error http://localhost:8080/health/live)" = Healthy
          curl --fail --silent --show-error -I http://localhost/ | grep "200 OK"
      - name: Container logs
        if: failure() && hashFiles('.env') != ''
        run: docker compose --env-file .env logs
      - name: Clean up
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env down --volumes --remove-orphans
          else
            echo "No .env file was created; nothing to clean up."
          fi
