services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro,Z
      - ./nginx/certs:/etc/nginx/certs:ro,Z
    networks:
      app:
        ipv4_address: ${NGINX_IP:-172.28.0.10}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: locatarius_db
      POSTGRES_USER: locatarius_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata18:/var/lib/postgresql
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locatarius_admin -d locatarius_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-provision:
    image: postgres:18-alpine
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/sql/provision.sql"]
    environment:
      PGHOST: postgres
      PGDATABASE: locatarius_db
      PGUSER: locatarius_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD}
    volumes:
      - ./docker/postgres/provision.sql:/sql/provision.sql:ro,Z
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy

  db-migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=locatarius_db;Username=locatarius_migrator;Password=${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD}
      RUN_MIGRATIONS: "true"
      EXIT_AFTER_MIGRATIONS: "true"
      SeedAdmin__Email: ${SeedAdmin__Email:?Set SeedAdmin__Email}
      SeedAdmin__Password: ${SeedAdmin__Password:?Set SeedAdmin__Password}
      SeedAdmin__FirstName: ${SeedAdmin__FirstName:?Set SeedAdmin__FirstName}
      SeedAdmin__LastName: ${SeedAdmin__LastName:?Set SeedAdmin__LastName}
      SeedDemoData__Enabled: ${SeedDemoData__Enabled:-false}
      SeedDemoData__Password: ${SeedDemoData__Password:-}
    networks: [app]
    depends_on:
      db-provision:
        condition: service_completed_successfully

  db-grants:
    image: postgres:18-alpine
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/sql/grants.sql"]
    environment:
      PGHOST: postgres
      PGDATABASE: locatarius_db
      PGUSER: locatarius_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./docker/postgres/grants.sql:/sql/grants.sql:ro,Z
    networks: [app]
    depends_on:
      db-migrator:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=locatarius_db;Username=locatarius_app;Password=${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD}
      RUN_MIGRATIONS: "false"
      Proxy__TrustedProxy: ${NGINX_IP:-172.28.0.10}
      DataProtection__KeyPath: /home/app/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 2 http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 10
    expose: ["8080"]
    volumes:
      - dataprotection:/home/app/.aspnet/DataProtection-Keys
    networks: [app]
    depends_on:
      db-grants:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose: ["80"]
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  app:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/24}
volumes:
  pgdata18:
  dataprotection:
