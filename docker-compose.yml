services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: locatarius_db
      POSTGRES_USER: locatarius_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Keep PostgreSQL 16 data separate; migrate existing data by dump/restore.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locatarius_admin -d locatarius_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=locatarius_db;Username=locatarius_admin;Password=${POSTGRES_PASSWORD}
      SeedAdmin__Email: ${SeedAdmin__Email:?Set SeedAdmin__Email}
      SeedAdmin__Password: ${SeedAdmin__Password:?Set SeedAdmin__Password}
      SeedAdmin__FirstName: ${SeedAdmin__FirstName:?Set SeedAdmin__FirstName}
      SeedAdmin__LastName: ${SeedAdmin__LastName:?Set SeedAdmin__LastName}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata18:
