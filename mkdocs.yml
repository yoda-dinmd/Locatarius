site_name: Locatarius Documentation
site_description: Secure Condominium Governance Platform Architecture & Specifications
site_author: Locatarius Team
repo_url: https://github.com/yoda-dinmd/Locatarius
repo_name: yoda-dinmd/Locatarius

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - tables
  - attr_list

nav:
  - Overview: index.md
  - Product & Delivery:
      - Roadmap: mvp-roadmap.md
      - Use-Case Catalogue: use-case-catalog.md
      - Traceability: traceability.md
      - Validation Report: validation.md
  - Architecture & Design:
      - Solution Design: solution-design.md
      - Data Model: data-model.md
      - Shared Patterns: shared-patterns.md
      - API Catalogue: api-catalog.md
      - Architecture Decisions: decisions.md
  - Operations & References:
      - Operations and Testing: operations-and-testing.md
      - Sources: sources.md
