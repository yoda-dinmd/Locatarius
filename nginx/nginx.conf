# Loaded as an HTTP-context template by the official nginx entrypoint.
# Docker DNS resolution keeps upstream addresses fresh after container recreation.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream api {
    zone api 64k;
    server backend:8080 resolve;
}
upstream web {
    zone web 64k;
    server frontend:80 resolve;
}
server {
    listen 80;
    server_name localhost 127.0.0.1;
    location = /nginx-health { access_log off; return 200 'healthy'; }
    location / { return 301 https://localhost:${HTTPS_PORT}$request_uri; }
}
server {
    listen 443 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Authentication responses must not be cached; backend sets Cache-Control.
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://web;
        proxy_set_header Host $http_host;
    }
}
